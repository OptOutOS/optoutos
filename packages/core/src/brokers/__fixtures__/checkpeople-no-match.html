<!--
  Trimmed CheckPeople `/results` fixture (2026-09-10).

  Originally a full captured HTML snapshot of a real CheckPeople response
  for a synthetic identity. Trimmed to just the structurally relevant
  markup (the "We found N Results" headline + the #modifySearchModal "No
  results found" modal) that motivated checkPeopleHasNoMatch's original
  (later reverted) implementation — see checkpeople.test.ts and
  checkpeople.ts's module docstring for the full story: this modal text
  is present UNCONDITIONALLY regardless of real match count, so
  checkPeopleHasNoMatch is now a permanent stub that always returns
  false, and this fixture no longer needs to be a byte-for-byte capture
  to remain a valid regression test.

  All <script> tags (CDN-loaded jQuery/Bootstrap/analytics, none of it
  relevant to the test) were removed to resolve GitHub code-scanning
  alert #4 (js/functionality-from-untrusted-source — a real, if
  inert-in-context, finding: this file was flagged as if it were live
  served content rather than a static test fixture that cheerio only
  ever parses, never executes).
-->
<div class="results-container ">
  <div class="text-center results-headline">
    <div class="container">
      <h1 class="results-headline-title mb-5">
        We found 10+ Results for <span class="font-weight-bold text-capitalize">Zaphod Beeblebrox</span>
      </h1>
      <h3 class="animation-subtext mt-3 mb-5"><strong>Preparing to build report, please wait.</strong></h3>
    </div>
    <button class="hidden-xs hidden-sm modify-search" data-toggle="modal" data-target="#modifySearchModal">Modify Search</button>
  </div>
</div>
<div class="modal fade gc1b-refine-search-modal with-gc1f" id="modifySearchModal" tabindex="-1" role="dialog" aria-labelledby="modifySearchModalLabel">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title"> No results found. Please refine your search </h4>
      </div>
    </div>
  </div>
</div>
